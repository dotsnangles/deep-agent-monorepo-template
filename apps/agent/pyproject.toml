[project]
name = "agent"
version = "0.1.0"
description = "Hollow Echo Deep Agent Server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ag-ui-langgraph>=0.0.30",
    "copilotkit>=0.1.94",
    "deepagents>=0.7.6",
    "fastapi>=0.141.1",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.4",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.5.1",
    "langchain-anthropic>=1.5.6",
    "langchain-google-genai>=4.3.3",
    "langfuse>=4.14.4",
    "langgraph>=1.2.11",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.52.3",
    "psycopg[binary,pool]>=3.3.4",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langchain-redis>=0.2.5",
    "redis[hiredis]>=7.4.1",
    "pandas>=3.0.5",
    "numpy>=2.5.2",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
    "tabulate>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
